# SCD Engine — Canonical Field Registry（憲法 Phase 0 交付）
# =============================================================================
# 地位：全系統唯一欄位字典（ARCHITECTURE_BLUEPRINT.md §3 所有權表第一列）。
#        任何欄位問「你是誰」，唯一答案在此。CI 對拍（tests/test_field_registry.py）
#        擋住未登記欄位進入快照。
#
# Phase 0 鐵律 = ADDITIVE ONLY：本檔只「記載」現況，不改 schema、不改引擎、
#   不 rename、不動 replay contract。replay 等級只記載，不去改 verify_all_replay.py
#   的 strip 清單（那是 Phase 1/S06）。已知病灶如實記錄，不在 Phase 0 修（如
#   dealer_net_buy 實裝投信 → 記錄事實，正名待 Phase 1）。
#
# 三軸契約（BLUEPRINT §5，每欄在三軸各有一位置）：
#   state (三態)  : I=Input(原始事實) | O=Observation(判斷) | M=Metadata(環境/出處)
#   replay (等級) : MUST-I(可重算,參與canonical hash)
#                 | epoch-scoped-O(同schema版本內同輸入必重算相同,參與hash)
#                 | excluded-M(記錄但排除於replay比對)
#                 * lineage 註記：provenance/audit_log 是 M 但作 lineage 背書入 hash；
#                   現況 environment 污染 hash（BLUEPRINT 不變量 #6 的修正目標，Phase 4）
#   grain (粒度)  : ticker | date(市場/快照級) | sector
#
# owner 詞彙（照 BLUEPRINT §3）：
#   fetch/Adapter · Pipeline(ingest) · Golden · StateMachine · Chip ·
#   temporal_enrich · Market · market_pulse · Distribution · Config ·
#   Hashing · WORM-Archive · Schema-versioning
#
# status：
#   active            = 現行快照真的有此欄（含 P3a abstain 佔位）
#   deprecated-pending = 殭屍欄，replay 生命週期內續存、不擴不消費，major(2.0)移除
#   planned           = 17 欄核准清單（NOTES #54），尚未落地，1.9.0 才落
# =============================================================================

meta:
  registry_version: "0.1.0"
  phase: "Phase 0 — Canonical Field Registry"
  authored: "2026-07-10"
  snapshot_schema_version_at_authoring: "1.8.1"
  ground_truth_snapshot: "reports/2026-07-09.json"
  counts:
    snapshot_fields: 18
    record_fields: 70
    planned_fields: 18
  notes:
    - "現有快照全欄位登記完畢（頂層 18 + per-stock record 70 = 88 active/deprecated 欄）。"
    - >
      planned 清單 = 憲法 §4 表逐名登記，得 18 個 distinct 欄名。憲法 §4 標題稱
      「17 欄」= 來源 off-by-one（obs_chip_grade 含 total 子值歷史上曾與 total 併計為
      一行）。Phase 0 忠實登記全部 18 名，不為湊數丟欄；此差異回報 Yonki。
    - "CI 對拍以 ground_truth_snapshot 同型的最新 reports/YYYY-MM-DD.json 為準。"
    - >
      對拍發現「快照有但 FIELD_MAP 未列」的欄位（Phase 0 補登記，非新增）：
      open、fii_buy_ratio、fii_holding_trend_5d、weakening、market_volume(FIELD_MAP有)、
      signal_age_days。其中 weakening 是 nested observation 物件（mc weakening_profile，
      NOTES #32「weakening(mc,已落地)」），schema $defs 未宣告但實際落地。
    - >
      Phase 1 第 3+4 線（2026-07-10，NOTES #1/#38）追加 4 個 planned_fields：
      trust_net_buy、prop_net_buy、fii_sell_raw、main_force_sell_raw。這 4 個是
      raw I 態 adapter staging 欄，與上面「18 欄」核准落地清單（NOTES #54，皆 O
      態判斷欄）屬不同批次，故 counts.planned_fields 維持 18（該計數專指憲法 §4
      表）——本檔 planned_fields 區塊實際條目數＝18+4=22。data/adapters/legacy.py
      已輸出 trust_net_buy/prop_net_buy/sell_raw，core/ingest.py 尚未消費（零快照
      內容變更，見 docs/migration/P1-worm-backfill-report.md）。
    - >
      Phase 1 第 1 線（判斷參數 config 化，NOTES #33/#47）：存活引擎 golden /
      state_machine / chip_score / market_context 的判斷門檻、conviction 權重與
      TIER_A 名單已外置至 core/engine_params.py（零環境依賴的純 Python config，
      值不變輸出 bit-identical，見 tests/test_config_extraction.py）。
      config_snapshot 入 canonical hash 隨 1.9.0（Phase 2），本輪僅參數外置、
      未做 hash 綁定。

# =============================================================================
# A. 頂層 snapshot 欄位（grain=date，一快照一筆）
# =============================================================================
snapshot_fields:
  - name: schema_version
    semantic: "canonical schema 版本識別"
    state: M
    grain: date
    replay: excluded-M
    owner: Schema-versioning
    status: active

  - name: date
    semantic: "交易日（快照 identity）"
    state: I
    grain: date
    replay: MUST-I
    owner: Pipeline(ingest)
    status: active

  - name: generated_at
    semantic: "快照產生牆鐘（ISO8601 UTC）"
    state: M
    grain: date
    replay: excluded-M
    owner: Pipeline(ingest)
    status: active

  - name: config_hash
    semantic: "config 衍生完整性值（sha256）"
    state: O
    grain: date
    replay: epoch-scoped-O
    owner: Hashing
    status: active

  - name: core_version
    semantic: "產生此快照的 core 版本字串"
    state: M
    grain: date
    replay: excluded-M
    owner: Schema-versioning
    status: active

  - name: environment
    semantic: "replay 重現性環境元資料（python/os/numpy/decimal/locale/tz + lookback 鏈）"
    state: M
    grain: date
    replay: excluded-M   # 病灶：現況含 os/python 進 canonical hash（NOTES #3），Phase 4 白名單修
    owner: Pipeline(ingest)
    status: active

  - name: provenance
    semantic: "逐來源出處（raw_sha256/archive 路徑/field_to_source），lineage 背書"
    state: M
    grain: date
    replay: excluded-M   # lineage：內容作完整性背書，Phase 1 archive 加版本維度（NOTES #18）
    owner: WORM-Archive
    status: active
    # LINEAGE 例外（S06 RC-5 / core/replay_contract.py）：provenance 雖是 M 態，
    # 其完整性子欄（raw_sha256/archived_sha256/archived_copy_path）必須留在比對
    # hash 內——它們是偵測 archive 漂移的唯一手段。故 provenance **不**整欄抹除，
    # 只抹以下 mtime 衍生的 volatile 子欄（存於 provenance.sources[*] 內）。
    replay_role: lineage
    replay_volatile_subfields: [fetched_at, report_date, data_lag_days]

  - name: config_snapshot
    semantic: "凍結的 config（判斷參數正本，參與 hash）"
    state: I
    grain: date
    replay: MUST-I
    owner: Config
    status: active

  - name: universe_size
    semantic: "當日母體股票數（衍生計數）"
    state: O
    grain: date
    replay: epoch-scoped-O
    owner: Pipeline(ingest)
    status: active

  - name: eligible_count
    semantic: "通過資格股票數（P3a 恆 0，全 abstain）"
    state: O
    grain: date
    replay: epoch-scoped-O
    owner: Golden
    status: active

  - name: fii_pending
    semantic: "1.8.1 兩段式快照旗標：true=當日 T86 未到手、fii 欄待補"
    state: O
    grain: date
    replay: epoch-scoped-O
    owner: Pipeline(ingest)
    status: active

  - name: market_regime
    semantic: "頂層市場體制 stub（label/classifier/confidence/features 恆 stub_v0）"
    state: O
    grain: date
    replay: epoch-scoped-O
    owner: Market
    status: deprecated-pending   # NOTES #40：真值走 planned obs_market_*；major 移除
    alias: obs_market_regime      # 真值繼任欄（planned）

  - name: episodes_active_at_start
    semantic: "快照產生時已活躍的 episode 清單"
    state: O
    grain: date
    replay: epoch-scoped-O
    owner: Pipeline(ingest)
    status: active

  - name: episodes_changed_today
    semantic: "當日狀態變更的 episode 清單"
    state: O
    grain: date
    replay: epoch-scoped-O
    owner: Pipeline(ingest)
    status: active

  - name: tier_transitions
    semantic: "當日 per-stock tier 轉移清單"
    state: O
    grain: date
    replay: epoch-scoped-O
    owner: Golden
    status: active

  - name: stocks
    semantic: "per-stock record 陣列（I+O 混態容器，逐欄定義見 record_fields）"
    state: I   # 容器；成員三態各自定義
    grain: ticker
    replay: MUST-I   # 容器；成員 replay 等級各自定義
    owner: Pipeline(ingest)
    status: active

  - name: rankings
    semantic: "分層名單（golden/watch/neutral/ignored + sort_keys_used）"
    state: O
    grain: date
    replay: epoch-scoped-O
    owner: Golden
    status: active

  - name: audit_log
    semantic: "事件流水（ELIMINATED/LOOKBACK_VERIFIED/... lineage）"
    state: M
    grain: date
    replay: excluded-M   # lineage 背書
    owner: Pipeline(ingest)
    status: active

# =============================================================================
# B. Per-stock record 欄位（stocks[] 內，grain=ticker）
