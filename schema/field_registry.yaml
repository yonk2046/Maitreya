  - {name: volume,        semantic: "🔴🟡 名叫『量』實為主力買超張數（ingest:155←buy_vol_lots）；正名待 Phase 1", state: I, grain: ticker, replay: MUST-I, owner: fetch/Adapter, status: active, alias: mf_net_buy}
