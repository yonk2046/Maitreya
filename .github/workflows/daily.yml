name: Maitreya Daily Pipeline
# BACKUP writer (OPS-1, 2026-06-12). The PRIMARY writer is the local
# launchd job (deploy/daily_and_push.sh) at 19:00 Asia/Taipei. This
# workflow runs one hour later and SKIPS itself when the primary already
# committed today's snapshot — the two pipelines no longer race on main.
# 2026-07-03: the guard now applies to ALL triggers (schedule + dispatch).
# A cron-job.org trigger fires workflow_dispatch daily at ~19:05; without
# the guard it re-ran the full pipeline even when a snapshot was already
# published (supersede churn / half-baked data-only commits).
on:
  schedule:
    - cron: '0 12 * * 1-5'   # 20:00 Asia/Taipei (primary runs 19:00)
    # 2026-07-06: T+1 morning catch-up (08:35 Taipei, Tue-Sat covers Mon-Fri
    # sessions). HiNetCDN 307-blocks *same-day* T86 for datacenter IPs even
    # late evening, so when the Mac is off the evening runs can never build a
    # fresh snapshot. By next morning the resource is CDN-cached everywhere →
    # this run builds YESTERDAY's snapshot reliably (date resolution, Fubon
    # rankings and STOCK_DAY_ALL all naturally point at the prior session in
    # the morning). Skips itself when the snapshot already exists.
    - cron: '35 0 * * 2-6'   # 08:35 Asia/Taipei next morning
  workflow_dispatch:
env:
  TZ: Asia/Taipei
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Skip if today's snapshot is already published
        id: guard
        run: |
          TODAY=$(date +%F)   # Asia/Taipei via env.TZ
          # Fresh checkout of origin/main → file existence == published state.
          # Applies to ALL triggers (schedule / dispatch / cron-job.org).
          if [ -f "reports/${TODAY}.json" ]; then
            echo "reports/${TODAY}.json already on origin/main — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No snapshot for ${TODAY} yet — running pipeline."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Fetch market pulse (non-blocking)
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true  # fails on non-trading days; parity with primary
        run: python3 tools/fetch_market_pulse.py
      # H3 stability proof requires failures to be VISIBLE — do not mask
      # make daily / verify-index. If either fails, suspect data must NOT
      # be auto-committed. (B1 epoch-aware verify landed 2026-06-11;
      # replay mismatches now indicate real corruption, not schema drift.)
      - name: Run daily pipeline
        if: steps.guard.outputs.skip != 'true'
        # 兩段式快照 (2026-07-07): 只有 20:00 晚班 schedule 允許建 partial
        # (fii_pending) 快照 — CDN 擋 datacenter IP 抓當日 T86, 晚班永遠拿不到。
        # 早班 (08:35) 與所有 dispatch 維持 strict: 沒有新鮮 T86 就不建,
        # 早班抓「昨日」T86 必成功 → 自動 supersede 補完晚班的 partial。
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 12 * * 1-5" ]; then
            make daily-partial
          else
            make daily
          fi
      - name: Verify index
        if: steps.guard.outputs.skip != 'true'
        run: make verify-index
      - name: Run fast tests
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true  # visibility only; must not block data commit
        run: make test-fast
      - name: Commit data and reports
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "maitreya-bot"
          git config user.email "maitreya-bot@users.noreply.github.com"
          git add data/ reports/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: daily pipeline $(date +%Y-%m-%d) [skip ci]"
            git pull --rebase origin main
            git push
          fi
