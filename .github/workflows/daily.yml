name: Maitreya Daily Pipeline
# 觸發器角色以 ARCHITECTURE.md §5(2026-09-15 實測版)為準。摘要:
#   - 事實主力 = cron-job.org 18:05 的 workflow_dispatch(雲端 IP 目前可取得
#     當日 T86,8 月起建出完整快照)。cron-job.org 另有 08:35 T+1 補班 job。
#   - 本機 launchd 19:00 為備援;雲端已 commit 當日快照時跳過。
#   - 下方兩條原生 cron 名義上是備援,但 GHA 排程慣性延遲 4–5 小時:
#     20:00 實際落在隔日 00–02 點(過午夜日期解析會錯,9/7 建成 9/4),
#     08:35 實際落在 ~13:00(被 intraday guard 擋掉)。不可依賴。
# The "Skip if today's snapshot is already published" guard applies to ALL
# triggers (2026-07-03), so concurrent triggers never double-publish.
on:
  schedule:
    - cron: '0 12 * * 1-5'   # 設定 20:00 台北;實測落地 00:00–02:00(隔日)
    - cron: '35 0 * * 2-6'   # 設定 08:35 台北;實測落地 ~13:00(盤中,被 guard 擋)
  workflow_dispatch:
env:
  TZ: Asia/Taipei
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Skip if today's snapshot is already published
        id: guard
        run: |
          TODAY=$(date +%F)   # Asia/Taipei via env.TZ
          # Fresh checkout of origin/main → file existence == published state.
          # Applies to ALL triggers (schedule / dispatch / cron-job.org).
          if [ -f "reports/${TODAY}.json" ]; then
            echo "reports/${TODAY}.json already on origin/main — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No snapshot for ${TODAY} yet — running pipeline."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Fetch market pulse (non-blocking)
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true  # fails on non-trading days; parity with primary
        run: python3 tools/fetch_market_pulse.py
      # H3 stability proof requires failures to be VISIBLE — do not mask
      # make daily / verify-index. If either fails, suspect data must NOT
      # be auto-committed. (B1 epoch-aware verify landed 2026-06-11;
      # replay mismatches now indicate real corruption, not schema drift.)
      - name: Run daily pipeline
        if: steps.guard.outputs.skip != 'true'
        # 兩段式快照 (2026-07-07): 只有 20:00 晚班 schedule 允許建 partial
        # (fii_pending) 快照 — CDN 擋 datacenter IP 抓當日 T86, 晚班永遠拿不到。
        # 早班 (08:35) 與所有 dispatch 維持 strict: 沒有新鮮 T86 就不建,
        # 早班抓「昨日」T86 必成功 → 自動 supersede 補完晚班的 partial。
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 12 * * 1-5" ]; then
            make daily-partial
          else
            make daily
          fi
      - name: Verify index
        if: steps.guard.outputs.skip != 'true'
        run: make verify-index
      - name: Commit data and reports
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "maitreya-bot"
          git config user.email "maitreya-bot@users.noreply.github.com"
          git add data/ reports/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: daily pipeline $(date +%Y-%m-%d) [skip ci]"
            git pull --rebase origin main
            git push
          fi
      # ⚠️ 測試必須排在 commit 之後(2026-09-15 事故)。
      # 原本排在 commit 之前,靠 continue-on-error 保證「不擋資料」—— 但
      # continue-on-error 只管「步驟失敗」,管不到 job 層的 timeout-minutes:
      # 測試跑超過 30 分鐘時整個 job 被取消,後面的 commit 直接 skipped。
      # 9/2、9/7–9/11、9/14 共 7 個交易日:pipeline 成功、verify 通過、
      # 快照已建好,全部卡在這一步被砍,資料隨 runner 銷毀。
      # 放在 commit 之後 → 無論測試跑多久、卡不卡住,資料都已經落地。
      # continue-on-error 暫時保留(2026-09-15):有 14 顆測試直接讀 gitignored 的
      # 執行期檔 data/today.json(test_replay / test_config_extraction /
      # test_adapter_contract / test_tdcc_adapter)。原生 08:35 cron 常延遲到盤中
      # 才跑,守門員擋下 fetch → 沒有 today.json → 這 14 顆每天必紅。拿掉
      # continue-on-error 會變成每天一封假警報,重演「警報太多被忽略」。
      # 移除條件:那 14 顆改用 reports/_raw_archive 的 WORM fixture,不再依賴執行期檔。
      - name: Run fast tests
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 10
        run: make test-fast
